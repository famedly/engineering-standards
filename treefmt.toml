# managed-by: engineering-standards — do not edit manually.
#
# Regenerate with `nix run .#filegen-activate`.

excludes = [
    ".github/workflows/check-pre-commit-hooks.yml",
    ".pre-commit-config.yaml",
    ".editorconfig",
    ".gitattributes",
    ".github/workflows/check-pre-commit-hooks.yml.license",
    ".prettierrc.yaml",
    ".taplo.toml",
    "treefmt.toml",
    "package-lock.json",
]
walk = "git"

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]
options = ["--strict"]

[formatter.prettier]
command = "prettier"
excludes = ["**/charts/**/templates/*.yaml", "**/charts/**/templates/*.yml", "**/charts/**/templates/**/*.yaml", "**/charts/**/templates/**/*.yml"]
includes = [
    "*.cjs",
    "*.css",
    "*.html",
    "*.js",
    "*.json",
    "*.json5",
    "*.jsx",
    "*.md",
    "*.mdx",
    "*.mjs",
    "*.scss",
    "*.ts",
    "*.tsx",
    "*.vue",
    "*.yaml",
    "*.yml",
]
options = ["--write"]

[formatter.rustfmt]
command = "rustfmt"
includes = ["*.rs"]
options = ["--config", "skip_children=true", "--edition", "2024"]

[formatter.shfmt]
command = "shfmt"
includes = ["*.sh", "*.bash", "*.envrc", "*.envrc.*"]
options = ["-w", "-i", "0", "-s"]

[formatter.taplo]
command = "taplo"
includes = ["*.toml"]
options = ["format"]
