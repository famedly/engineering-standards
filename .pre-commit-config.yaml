# managed-by: engineering-standards — do not edit manually.
#
# Regenerate with `nix run .#filegen-activate`.

repos:
- hooks:
  - id: check-added-large-files
    stages: []
  - id: check-case-conflict
    stages: []
  - id: check-illegal-windows-names
    stages: []
  - id: end-of-file-fixer
    stages: []
  - id: fix-byte-order-marker
    stages: []
  - id: check-json
    stages: []
  - id: check-json5
    stages: []
  - id: check-toml
    stages: []
  - id: check-vcs-permalinks
    stages: []
  - id: check-xml
    stages: []
  - args:
    - --fix=lf
    id: mixed-line-ending
    stages: []
  - id: check-symlinks
    stages: []
  - id: destroyed-symlinks
    stages: []
  - id: check-merge-conflict
    stages: []
  - id: detect-private-key
    stages: []
  - exclude_types:
    - rust
    id: check-shebang-scripts-are-executable
    stages: []
  - id: check-executables-have-shebangs
    stages: []
  repo: builtin
- hooks:
  - args:
    - --write-changes
    - --force-exclude
    description: Check the repository for spelling mistakes
    entry: typos
    id: typos
    language: system
    name: typos
    stages: []
    types:
    - text
  - description: Ensure that files set up with the filegen module are up-to-date
    entry: nix run .#filegen-activate
    id: filegen
    language: system
    name: filegen
    pass_filenames: false
    stages:
    - pre-push
  - description: Format *all* files
    entry: treefmt
    id: treefmt
    language: system
    name: treefmt
    require_serial: true
    stages: []
  repo: local
- hooks:
  - args:
    - follow
    description: Ensure that flake inputs are recursively de-duplicated
    entry: flake-edit
    files:
      glob: '{flake.nix,flake.lock}'
    id: flake-follows
    language: system
    name: flake-follows
    pass_filenames: false
    stages: []
  repo: local
- hooks:
  - args:
    - lint-file
    description: Ensure compliance with REUSE recommendations
    entry: reuse
    id: reuse
    language: system
    name: reuse
    stages: []
  repo: local
- hooks:
  - args:
    - -c
    - --
    - echo "/nix/store/ path found in filegen-generated file, which is forbidden:";
      ! rg --with-filename '/nix/store/[0-9a-z]{32}' $@
    - --
    description: Check that we don't have nix store paths in filegen generated files.
      Nix store paths will vary from system to system, causing a Linux user to generate
      different files from a mac user, and getting an error.
    entry: bash
    files:
      glob: '{.github/workflows/check-pre-commit-hooks.yml,.pre-commit-config.yaml,.editorconfig,.gitattributes,.github/workflows/check-pre-commit-hooks.yml.license,.taplo.toml,treefmt.toml}'
    id: store_paths_in_filegen
    language: system
    name: store_paths_in_filegen
    stages: []
  repo: local
- hooks:
  - description: Evaluate the Dart standards against the fixture repository
    entry: dart-standards-fixture
    id: dart-standards
    language: system
    name: dart standards
    pass_filenames: false
    stages:
    - pre-push
  repo: local
