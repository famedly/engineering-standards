# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}
jobs:
  populate-x86_64-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN_FAMEDLY }}
          name: famedly
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY_FAMEDLY }}
          skipPush: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
      - name: Build what the other repositories resolve against
        run: nix build --no-link --print-build-logs .#devShells.x86_64-linux.standards .#packages.x86_64-linux.famedly-dart-sdk .#packages.x86_64-linux.famedly-flutter-sdk .#packages.x86_64-linux.famedly-rust-toolchain .#packages.x86_64-linux.famedly-vodozemac
name: Fill the shared binary cache
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
